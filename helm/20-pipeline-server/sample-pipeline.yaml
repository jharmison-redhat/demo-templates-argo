apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-pipeline-server
spec:
  destination:
    name: in-cluster
    namespace: pipeline-server
  source:
    path: helm/20-pipeline-server/
    repoURL: https://github.com/redhat-ai-americas/demo-templates-argo.git
    targetRevision: HEAD
    helm: {}
  sources: []
  project: default
  ignoreDifferences:
  - group: datasciencepipelinesapplications.opendatahub.io
    kind: DataSciencePipelinesApplication
    jsonPointers:
    - /spec/objectStorage/externalStorage/bucket
    - /spec/objectStorage/externalStorage/host
    - /spec/objectStorage/externalStorage/scheme
    - /spec/objectStorage/externalStorage/region
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 3
        maxDuration: 30m
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
