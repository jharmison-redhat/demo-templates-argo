apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ .Values.objectStorage.generateBucketName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  generateBucketName: {{ .Values.objectStorage.generateBucketName }}
  storageClassName: {{ .Values.objectStorage.storageClassName }}
